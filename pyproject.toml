[tool.poetry]
name = "requirement-analysis-agent"
version = "0.1.0"
description = "CLI agent that analyses software requirements for ambiguity, missing info, and edge cases using a local LLM and RAG knowledge base"
authors = ["Nivetha <nivetha676@gmail.com>"]
readme = "README.md"
packages = [{include = "knowledge"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
openai = ">=1.0.0"
rich = ">=13.0.0"
typer = ">=0.12.0"
chromadb = ">=0.5.0"
sentence-transformers = ">=3.0.0"
pypdf = ">=4.0.0"
markdown = ">=3.5.0"
reportlab = ">=4.0.0"

[tool.poetry.scripts]
analyse = "main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
